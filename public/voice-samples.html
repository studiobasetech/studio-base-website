<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Eva voice samples</title>
<style>
  body{margin:0;background:#050507;color:#fff;font:15px/1.5 system-ui,-apple-system,sans-serif}
  main{max-width:640px;margin:0 auto;padding:40px 20px}
  h1{font-size:26px;margin:0 0 6px}
  p{color:#a1a1aa;margin:0 0 24px}
  h2{font-size:15px;letter-spacing:.15em;text-transform:uppercase;color:#60a5fa;margin:28px 0 10px}
  button{display:flex;justify-content:space-between;align-items:center;width:100%;margin:6px 0;padding:14px 16px;border-radius:12px;border:1px solid #27272a;background:#111114;color:#fff;font:inherit;cursor:pointer;text-align:left}
  button:hover{border-color:#3b82f6}
  button.playing{border-color:#3b82f6;background:#0b1730}
  small{color:#71717a}
</style>
</head>
<body>
<main>
  <h1>Eva voice samples</h1>
  <p>Tap a voice to hear the same greeting. Then tell Claude one English and one Spanish voice.</p>
  <h2>English</h2><div id="en"></div>
  <h2>Español</h2><div id="es"></div>
</main>
<script>
const TEXT = {
  en: "Hi, thanks for calling Studio Base! I'm Eva, the AI receptionist. I can tell you about our services, answer your questions, or book you a free consultation. How can I help you today?",
  es: "¡Hola, gracias por llamar a Studio Base! Soy Eva, la recepcionista con inteligencia artificial. Puedo contarte sobre nuestros servicios, responder tus preguntas o agendarte una consulta gratis. ¿En qué te puedo ayudar hoy?"
};
const VOICES = {
  en: [["original","Original (current voice)"],["melo","A · Melo","unlimited"],["aura:luna","B · Luna"],["aura:thalia","C · Thalia"],["aura:asteria","D · Asteria"],["aura:athena","E · Athena"],["aura:aurora","F · Aurora"],["aura:helena","G · Helena"]],
  es: [["original","Original (voz actual)"],["melo","A · Melo","ilimitada"],["aura:celeste","B · Celeste"],["aura:estrella","C · Estrella"],["aura:carina","D · Carina"],["aura:diana","E · Diana"],["aura:selena","F · Selena"]]
};
const audio = new Audio();
const urls = {};
let current = null;
async function play(lang, voice, btn) {
  audio.pause();
  if (current) current.classList.remove("playing");
  current = btn; btn.classList.add("playing");
  const label = btn.querySelector(".st");
  const key = lang + voice;
  try {
    if (!urls[key]) {
      label.textContent = "loading…";
      if (voice === "original") urls[key] = "/audio/eva/" + lang + "/greet.mp3";
      else {
        const r = await fetch("https://eva-ai.studiobase-tech.workers.dev", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ tts: TEXT[lang], lang, voice })
        });
        if (!(r.headers.get("content-type") || "").includes("audio")) throw new Error(await r.text());
        urls[key] = URL.createObjectURL(await r.blob());
      }
    }
    label.textContent = "▶ playing";
    audio.src = urls[key];
    audio.onended = () => { btn.classList.remove("playing"); label.textContent = "▶"; };
    await audio.play();
  } catch (e) {
    label.textContent = "not available right now";
    btn.classList.remove("playing");
  }
}
for (const lang of ["en", "es"]) {
  for (const [voice, name, note] of VOICES[lang]) {
    const b = document.createElement("button");
    b.innerHTML = "<span>" + name + (note ? " <small style='color:#4ade80'>(" + note + ")</small>" : "") + "</span><small class=\"st\">▶</small>";
    b.onclick = () => play(lang, voice, b);
    document.getElementById(lang).appendChild(b);
  }
}
</script>
</body>
</html>
